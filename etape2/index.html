<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons - Étape 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">
        <table>
            <tr>
                <th>N°</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Points</th>
                <th>Select</th>
            </tr>
            <tr class="row">
                <td class="col_number">1</td>
                <td class="col_text">Nom1</td>
                <td class="col_text">Prénom1</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox" /></td>
            </tr>
            <tr class="row">
                <td class="col_number">2</td>
                <td class="col_text">Nom2</td>
                <td class="col_text">Prénom2</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox" /></td>
            </tr>
            <tr class="row">
                <td class="col_number">3</td>
                <td class="col_text">Nom3</td>
                <td class="col_text">Prénom3</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox" /></td>
            </tr>
        </table>

        <!-- Bouton placé après le tableau, dans le conteneur.
             Événement onclick en ligne (cours slides 22 et 129-133) -->
        <button onclick="doInsertRowTable(99, 'nom', 'prenom', 10)">Ajouter</button>
    </div>

    <!-- Script externe placé à la FIN du body : le DOM est déjà chargé quand il s'exécute
         (cours slides 24, 26, 27) -->
    <script src="script.js"></script>
</body>
</html>
