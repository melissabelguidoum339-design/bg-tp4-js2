<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons - Étape 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">
        <table>
            <tr>
                <th>N°</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Points</th>
                <th>Select</th>
            </tr>
            <!-- Lignes d'aperçu : visibles même sans JavaScript. init() dans script.js les remplace
                 par les lignes générées depuis le tableau "persons" (cours slides 39-40, 44, 104) -->
            <tr class="row static">
                <td class="col_number">1</td>
                <td class="col_text">nom-1</td>
                <td class="col_text">prenom-1</td>
                <td class="col_number">5</td>
                <td class="col_chkbox"><input type="checkbox" /></td>
            </tr>
            <tr class="row static">
                <td class="col_number">2</td>
                <td class="col_text">nom-2</td>
                <td class="col_text">prenom-2</td>
                <td class="col_number">10</td>
                <td class="col_chkbox"><input type="checkbox" /></td>
            </tr>
            <tr class="row static">
                <td class="col_number">3</td>
                <td class="col_text">nom-3</td>
                <td class="col_text">prenom-3</td>
                <td class="col_number">15</td>
                <td class="col_chkbox"><input type="checkbox" /></td>
            </tr>
        </table>

        <button onclick="doInsertRowTable(99, 'nom', 'prenom', 10)">Ajouter</button>
        <!-- Nouveau bouton : affiche le tableau "persons" dans la console -->
        <button onclick="consoleTableau()">Console Tableau</button>
    </div>

    <!-- Script externe placé à la FIN du body : le DOM est déjà chargé quand il s'exécute
         (cours slides 24, 26, 27) -->
    <script src="script.js"></script>
</body>
</html>
